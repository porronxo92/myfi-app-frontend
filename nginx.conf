# ============================================================================
# NGINX Configuration for Angular SPA on Cloud Run
# ============================================================================
# Optimizado para:
# - Single Page Applications (fallback a index.html)
# - Cache agresivo de assets estáticos
# - Compresión gzip
# - Health checks
# - Puerto 8080 (Cloud Run)
# ============================================================================

# Número de worker processes (auto = detecta núcleos de CPU disponibles)
worker_processes auto;

# Archivo PID en /tmp (usuario nginx tiene permisos de escritura)
pid /tmp/nginx.pid;

# Configuración de eventos
events {
    # Máximo número de conexiones simultáneas por worker
    worker_connections 1024;
    
    # Método de procesamiento de eventos (epoll es eficiente en Linux)
    use epoll;
}

http {
    # ========================================================================
    # CONFIGURACIÓN PARA USUARIO NO-ROOT
    # ========================================================================
    # NGINX necesita escribir archivos temporales, usar /tmp donde tiene permisos
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ========================================================================
    # TIPOS MIME Y CHARSET
    # ========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Charset por defecto para respuestas HTML
    charset utf-8;

    # ========================================================================
    # LOGGING
    # ========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ========================================================================
    # OPTIMIZACIONES DE RENDIMIENTO
    # ========================================================================
    
    # Enviar archivos directamente desde kernel (más rápido)
    sendfile on;
    
    # Enviar headers en un solo paquete junto con el inicio del archivo
    tcp_nopush on;
    
    # No bufferear datos antes de enviar (reduce latencia)
    tcp_nodelay on;
    
    # Timeout de keep-alive connections
    keepalive_timeout 65;
    
    # Tamaño máximo de hash para tipos (previene warnings)
    types_hash_max_size 2048;
    
    # Ocultar versión de NGINX en headers (seguridad)
    server_tokens off;

    # ========================================================================
    # COMPRESIÓN GZIP
    # ========================================================================
    # Reduce el tamaño de transferencia hasta 80%
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";

    # ========================================================================
    # SERVIDOR PRINCIPAL
    # ========================================================================
    server {
        # Cloud Run requiere puerto 8080 (accesible sin root)
        listen 8080;
        
        # Nombre del servidor (se puede cambiar por tu dominio)
        server_name _;
        
        # Directorio raíz donde están los archivos del frontend
        root /usr/share/nginx/html;
        
        # Archivo índice por defecto
        index index.html;

        # ====================================================================
        # HEALTH CHECK ENDPOINT
        # ====================================================================
        # Obligatorio para Cloud Run y monitoreo
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }

        # ====================================================================
        # ASSETS ESTÁTICOS CON CACHE AGRESIVO
        # ====================================================================
        # Archivos con hash en el nombre (ej: main.a3f2b1c.js) nunca cambian
        # Cache por 1 año (inmutable)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # Habilitar CORS si necesitas consumir assets desde otros dominios
            add_header Access-Control-Allow-Origin *;
        }

        # ====================================================================
        # ROUTING PARA SPA (OBLIGATORIO PARA ANGULAR ROUTER)
        # ====================================================================
        # Angular usa client-side routing, NGINX debe hacer fallback a index.html
        # para todas las rutas que no sean archivos físicos
        location / {
            # Primero intenta servir el archivo solicitado
            # Si no existe, intenta servir como directorio
            # Si tampoco existe, sirve index.html (para Angular Router)
            try_files $uri $uri/ /index.html;
            
            # Cache mínimo para index.html (puede cambiar en cada deploy)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ====================================================================
        # MANEJO DE ERRORES
        # ====================================================================
        # Personalizar páginas de error (opcional)
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # ====================================================================
        # SEGURIDAD
        # ====================================================================
        # Headers de seguridad recomendados
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Desactivar listado de directorios
        autoindex off;
    }
}
